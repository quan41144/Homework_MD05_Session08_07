# ==========================================================================
#  GitLab CI/CD Pipeline cho Dự án Spring Boot với PostgreSQL
# ==========================================================================

stages:
  - test
  - build_image
  - deploy

# Các biến môi trường dùng chung cho Pipeline
variables:
  POSTGRES_DB: quickbite_user_db
  POSTGRES_USER: quickbite_user
  POSTGRES_PASSWORD: quickbite_password
  POSTGRES_HOST_AUTH_METHOD: trust

# --------------------------------------------------------------------------
# Stage 1: Kiểm thử mã nguồn (test) kết nối tới PostgreSQL Database Service
# --------------------------------------------------------------------------
test:
  stage: test
  image: gradle:8.5-jdk17-alpine
  services:
    - name: postgres:15-alpine
      alias: postgres
  variables:
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quickbite_user_db
    SPRING_DATASOURCE_USERNAME: quickbite_user
    SPRING_DATASOURCE_PASSWORD: quickbite_password
  script:
    - echo "=== Bắt đầu giai đoạn TEST ==="
    - cd user-service
    - gradle test --no-daemon

# --------------------------------------------------------------------------
# Stage 2: Đóng gói và đẩy Image lên Registry (build_image)
# --------------------------------------------------------------------------
build_image:
  stage: build_image
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "=== Đăng nhập vào GitLab Container Registry ==="
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "=== Build Docker image với Multi-stage build ==="
    - cd user-service
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - echo "=== Push Image lên Container Registry ==="
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

# --------------------------------------------------------------------------
# Stage 3: Triển khai ứng dụng (deploy)
# --------------------------------------------------------------------------
deploy:
  stage: deploy
  script:
    - echo "=== Bắt đầu giai đoạn DEPLOY ==="
    - echo "Triển khai ứng dụng từ Image: $CI_REGISTRY_IMAGE:latest"
    - echo "Triển khai thành công!"
