name: Verify GHCR Image

on:
  push:
    branches: [ "main" ]

jobs:
  verify-container:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Đăng nhập Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Xử lý chữ hoa, Pull và chạy Container
        run: |
          ACTOR_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/$ACTOR_LOWER/user-service:1.0.0"

          echo "Tiến hành kéo image: $IMAGE_TAG"
          docker pull $IMAGE_TAG

          echo "Khởi chạy container ở chế độ nền (-d)"
          docker run -d -p 8081:8081 $IMAGE_TAG
